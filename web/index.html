<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Task Manager Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Task Manager Agent</h1>
      <div id="auth">
        <input id="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <button id="login">Login</button>
        <span id="loginStatus"></span>
      </div>
      <div id="quick" class="panel">
        <input id="nl" placeholder="e.g., remind me to email Sara tomorrow at 9" />
        <button id="addNL">Parse & Add</button>
      </div>
      <div class="panel">
        <h2>Today</h2>
        <ul id="today"></ul>
      </div>
      <div class="panel">
        <h2>Upcoming</h2>
        <ul id="upcoming"></ul>
      </div>
      <div class="panel">
        <h2>Overdue</h2>
        <ul id="overdue"></ul>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
  </html>
