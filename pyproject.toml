[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager-agent"
version = "0.1.0"
description = "Local-first Task Manager Agent with FastAPI, LangGraph, SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.19",
  "python-dateutil>=2.9",
  "dateparser>=1.2",
  "passlib[bcrypt]>=1.7",
  "bcrypt==4.0.1",
  "python-jose[cryptography]>=3.3",
  "email-validator>=2.1",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "aiodns>=3.2",
  "python-multipart>=0.0.9",
  "tenacity>=8.4",
  "cachetools>=5.3",
  "loguru>=0.7",
  "orjson>=3.10",
  "langgraph>=0.2.33",
  "openai>=1.45.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-python-dateutil",
]

[tool.setuptools]
packages = ["app", "client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
