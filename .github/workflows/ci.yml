name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
      - name: Type check
        run: |
          mypy app client
      - name: Test
        env:
          SYNC_DATABASE_URL: sqlite:///./data/app.db
          DATABASE_URL: sqlite+aiosqlite:///./data/app.db
          INITIAL_ADMIN_EMAIL: ci@example.com
          INITIAL_ADMIN_PASSWORD: citest
        run: |
          mkdir -p data
          alembic upgrade head
          pytest -q

